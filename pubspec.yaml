name: hulka
description: Cross-hospital digital health, telemedicine, pharmacy and health intelligence platform.
publish_to: "none"
version: 0.3.2+5

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  uuid: ^4.5.1
  health: ^13.3.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
