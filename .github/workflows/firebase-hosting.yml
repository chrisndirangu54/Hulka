name: Deploy Hulka to Firebase Hosting

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Hulka CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hulka-firebase-hosting
  cancel-in-progress: false

jobs:
  deploy-hosting:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Flutter application
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
      - name: Deploy verified web build to Firebase Hosting only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HULKA_HEALTH_261029 }}
          channelId: live
          projectId: hulka-health-261029
